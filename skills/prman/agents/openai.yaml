interface:
  display_name: "PRman"
  short_description: "Contribute to well-known open-source projects"
  default_prompt: "Use $prman to find a small issue in a well-known project, implement and test the fix, show a simple preview, then ask before creating a Draft PR."
dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP server"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"
policy:
  allow_implicit_invocation: true
