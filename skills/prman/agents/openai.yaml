interface:
  display_name: "PRman"
  short_description: "Contribute to well-known open-source projects"
  default_prompt: "Use $prman to collect my PR count and target preferences, automatically start a Goal, then complete each meaningful contribution sequentially with a separate preview and confirmation."
dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP server"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"
policy:
  allow_implicit_invocation: true
