name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Quality gates
        run: make check PYTHON=python
      - name: Skill wrapper smoke test
        run: make demo PYTHON=python > /dev/null

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check 'build==1.3.0'
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify artifacts and installed CLI
        run: |
          python -c 'import glob; assert len(glob.glob("dist/*.whl")) == 1; assert len(glob.glob("dist/*.tar.gz")) == 1'
          python -m venv /tmp/prman-wheel-test
          /tmp/prman-wheel-test/bin/pip install --no-deps dist/*.whl
          /tmp/prman-wheel-test/bin/prman-codex --version
